# Админский routing для рассылки источников по чатам.
# Скопируй в admin-routing.yaml и подставь реальные Telegram ID.

admins:
  - id: 12345678
    alias: maintainer

source_groups:
  core:
    - opencode_changelog
    - openchamber_changelog
  releases:
    - codenomad_releases
  unity:
    - unity_ivanmurzak_releases
    - unity_coplay_releases
    - locus_releases

chats:
  - chat_id: -1001234567890
    alias: main
    title: Основной канал
    groups:
      - core
      - unity
    sources: []
    enabled: true
    send_summary: true
    delivery_mode: both
    summary_schedule:
      mode: immediate

  - chat_id: -1009876543210
    alias: backup
    title: Резервный канал
    groups: []
    sources:
      - codenomad_releases
    enabled: true
    send_summary: false
    delivery_mode: digest
    summary_schedule:
      mode: weekly
      time: "20:00"
      weekday: monday
